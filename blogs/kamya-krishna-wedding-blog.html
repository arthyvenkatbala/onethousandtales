<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="https://photos.smugmug.com/photos/i-WZXqNHB/0/X2/i-WZXqNHB-XL.jpg">
  <title>Kamya &amp; Krishna — The Wedding Story</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #faf9f7;
      color: #3a3533;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
    }
    .hero-text {
      position: relative;
      text-align: center;
      color: #fff;
      padding: 2rem;
    }
    .hero-text .names {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }
    .hero-text .amp {
      font-style: italic;
    }
    .hero-text .subtitle {
      font-size: clamp(0.75rem, 2vw, 1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 1.2rem;
      opacity: 0.9;
    }
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      opacity: 0.7;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(8px); }
    }

    /* ── Intro ── */
    .intro {
      max-width: 680px;
      margin: 5rem auto 4rem;
      padding: 0 2rem;
      text-align: center;
    }
    .intro .ornament {
      color: #c9a96e;
      font-size: 1.8rem;
      letter-spacing: 0.5em;
      margin-bottom: 1.5rem;
    }
    .intro p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-weight: 300;
      line-height: 1.85;
      color: #5a5250;
    }

    /* ── Gallery ── */
    .gallery-section {
      max-width: 1400px;
      margin: 0 auto 5rem;
      padding: 0 1.5rem;
    }
    .photo-grid {
      columns: 4;
      column-gap: 10px;
    }
    @media (max-width: 1100px) { .photo-grid { columns: 3; } }
    @media (max-width: 720px)  { .photo-grid { columns: 2; } }
    @media (max-width: 420px)  { .photo-grid { columns: 1; } }

    .photo-item {
      break-inside: avoid;
      margin-bottom: 10px;
      cursor: pointer;
      overflow: hidden;
      border-radius: 3px;
    }
    .photo-item img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.45s ease, filter 0.45s ease;
    }
    .photo-item:hover img {
      transform: scale(1.04);
      filter: brightness(1.07);
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(10,8,8,0.95);
      align-items: center;
      justify-content: center;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 8px 60px rgba(0,0,0,0.7);
    }
    .lightbox-close {
      position: fixed;
      top: 1.2rem; right: 1.5rem;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      opacity: 0.75;
      background: none;
      border: none;
      line-height: 1;
    }
    .lightbox-close:hover { opacity: 1; }
    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      color: #fff;
      cursor: pointer;
      opacity: 0.6;
      background: none;
      border: none;
      padding: 1rem;
      line-height: 1;
    }
    .lightbox-nav:hover { opacity: 1; }
    .lightbox-nav.prev { left: 0.5rem; }
    .lightbox-nav.next { right: 0.5rem; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      border-top: 1px solid rgba(201,169,110,0.3);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: #9a8880;
    }
    footer .gold { color: #c9a96e; }
  </style>
</head>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightboxOnBg(event)">
  <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
  <button class="lightbox-nav prev" onclick="navigateLightbox(-1)">&#8592;</button>
  <img src="" alt="" id="lightbox-img">
  <button class="lightbox-nav next" onclick="navigateLightbox(1)">&#8594;</button>
</div>

<script>
  const allImages = Array.from(document.querySelectorAll('.photo-item img')).map(i => i.src);
  let currentIdx = 0;

  function openLightbox(src) {
    currentIdx = allImages.findIndex(s => s === src);
    if (currentIdx === -1) currentIdx = 0;
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightbox-img').src = '';
    document.body.style.overflow = '';
  }
  function closeLightboxOnBg(e) {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  }
  function navigateLightbox(dir) {
    currentIdx = (currentIdx + dir + allImages.length) % allImages.length;
    document.getElementById('lightbox-img').src = allImages[currentIdx];
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigateLightbox(-1);
    if (e.key === 'ArrowRight') navigateLightbox(1);
  });
</script>
</body>
</html>
