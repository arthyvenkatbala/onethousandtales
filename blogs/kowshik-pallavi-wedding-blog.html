    /* ── Lightbox ── */
    .lightbox {

      inset: 0;

      cursor: pointer;

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightboxOnBg(event)">
  <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
  <button class="lightbox-nav prev" onclick="navigateLightbox(-1)">&#8592;</button>
  <img src="" alt="" id="lightbox-img">
  <button class="lightbox-nav next" onclick="navigateLightbox(1)">&#8594;</button>
</div>

<script>
  const allImages = Array.from(document.querySelectorAll('.photo-item img')).map(i => i.src);
  let currentIdx = 0;

  function openLightbox(src) {
    currentIdx = allImages.findIndex(s => s === src);
    if (currentIdx === -1) currentIdx = 0;
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.getElementById('lightbox-img').src = '';
    document.body.style.overflow = '';
  }
  function closeLightboxOnBg(e) {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  }
  function navigateLightbox(dir) {
    currentIdx = (currentIdx + dir + allImages.length) % allImages.length;
    document.getElementById('lightbox-img').src = allImages[currentIdx];
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigateLightbox(-1);
    if (e.key === 'ArrowRight') navigateLightbox(1);
  });
</script>
